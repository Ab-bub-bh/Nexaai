<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nexa AI - Chat Interface</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        :root {
            --hud-cyan: #00E5FF;
            --hud-blue: #0099FF;
            --hud-blue-deep: #0044AA;
            --hud-white: #D6F4FF;
            --hud-line: rgba(0, 229, 255, 0.55);
            --hud-line-soft: rgba(0, 229, 255, 0.22);
            --gray: #6E8DAF;
        }

        html, body { height: 100%; }

        body {
            background:
                radial-gradient(ellipse at 50% 50%, rgba(0, 120, 220, 0.14) 0%, transparent 55%),
                radial-gradient(ellipse at center, #041225 0%, #00060E 45%, #000205 100%);
            color: #E8F6FF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px);
            background-size: 64px 64px;
            pointer-events: none;
            z-index: 0;
            -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 78%);
            mask-image: radial-gradient(ellipse at center, black 0%, transparent 78%);
        }

        .chat-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 920px;
            height: 92vh;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            background:
                linear-gradient(135deg, rgba(0, 229, 255, 0.05), rgba(0, 102, 255, 0.015)),
                linear-gradient(180deg, rgba(0, 8, 20, 0.92), rgba(0, 4, 12, 0.97));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 229, 255, 0.22);
            border-radius: 10px;
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.55),
                0 0 80px rgba(0, 120, 220, 0.08),
                inset 0 0 40px rgba(0, 229, 255, 0.04);
            overflow: hidden;
        }

        /* ============================================
           HEADER
           ============================================ */
        .chat-header {
            padding: 18px 28px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            flex-shrink: 0;
            background: linear-gradient(180deg, rgba(0, 20, 40, 0.35), transparent);
        }

        .chat-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--hud-cyan), transparent);
            opacity: 0.5;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Menu button (opens AI feature sidebar) */
        .chat-menu-btn {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.35);
            color: var(--hud-cyan);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.82rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .chat-menu-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            border-color: rgba(0, 229, 255, 0.75);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.55);
        }

        .chat-menu-btn.active {
            background: rgba(0, 229, 255, 0.25);
            border-color: rgba(0, 229, 255, 0.9);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.65);
            color: #FFFFFF;
        }

        /* AI Avatar — premium sapphire core with AI text */
        .chat-header-avatar {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 38% 34%,
                    #FFFFFF 0%,
                    #D8F4FF 10%,
                    #7DD3FC 22%,
                    #38BDF8 38%,
                    #0284C7 58%,
                    #075985 78%,
                    #0C1A3A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 16px rgba(56, 189, 248, 0.7),
                0 0 36px rgba(2, 132, 199, 0.4),
                inset 0 0 14px rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
        }

        .chat-header-avatar::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(125, 211, 252, 0.95) 60deg,
                transparent 120deg,
                transparent 240deg,
                rgba(56, 189, 248, 0.9) 300deg,
                transparent 360deg
            );
            -webkit-mask: radial-gradient(circle, transparent 62%, #000 62%, #000 70%, transparent 70%);
            mask: radial-gradient(circle, transparent 62%, #000 62%, #000 70%, transparent 70%);
            animation: rotate-halo 6s linear infinite;
            pointer-events: none;
        }

        .chat-header-avatar::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 1px solid rgba(56, 189, 248, 0.6);
            animation: pulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        .chat-header-avatar-text {
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #FFFFFF;
            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.95),
                0 0 16px rgba(56, 189, 248, 0.9);
            position: relative;
            z-index: 1;
        }

        @keyframes rotate-halo {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .chat-header-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .chat-header-title {
            font-size: 0.82rem;
            color: var(--hud-white);
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
        }

        .chat-header-sub {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.6rem;
            color: var(--hud-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.9;
        }

        .chat-header-sub .hud-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--hud-cyan);
            box-shadow: 0 0 8px var(--hud-cyan), 0 0 16px var(--hud-cyan);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.75; }
        }

        .chat-close-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.35);
            color: var(--hud-cyan);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .chat-close-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            border-color: rgba(0, 229, 255, 0.75);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.55);
            transform: rotate(90deg);
        }

        /* ============================================
           AI SIDEBAR — ChatGPT-style left drawer
           ============================================ */
        .ai-sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 4, 12, 0.6);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 90;
        }

        .ai-sidebar-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .ai-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 300px;
            max-width: 85vw;
            background:
                linear-gradient(180deg, rgba(0, 14, 28, 0.98), rgba(0, 6, 14, 0.99));
            border-right: 1px solid rgba(0, 229, 255, 0.25);
            box-shadow:
                8px 0 40px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(0, 120, 220, 0.15);
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .ai-sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--hud-cyan), transparent);
            opacity: 0.5;
        }

        .ai-sidebar.open {
            transform: translateX(0);
        }

        /* Sidebar Header */
        .ai-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 18px 16px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.15);
            flex-shrink: 0;
            position: relative;
        }

        .ai-sidebar-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--hud-cyan), transparent);
            opacity: 0.4;
        }

        .ai-sidebar-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            color: var(--hud-cyan);
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
        }

        .ai-sidebar-title i {
            font-size: 0.9rem;
        }

        .ai-sidebar-close {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: var(--hud-cyan);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .ai-sidebar-close:hover {
            background: rgba(0, 229, 255, 0.2);
            border-color: rgba(0, 229, 255, 0.75);
            box-shadow: 0 0 14px rgba(0, 229, 255, 0.5);
            color: #FFFFFF;
        }

        /* Sidebar Nav */
        .ai-sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 229, 255, 0.3) transparent;
        }

        .ai-sidebar-nav::-webkit-scrollbar { width: 4px; }
        .ai-sidebar-nav::-webkit-scrollbar-track { background: transparent; }
        .ai-sidebar-nav::-webkit-scrollbar-thumb {
            background: rgba(0, 229, 255, 0.3);
            border-radius: 2px;
        }

        /* Feature button (icon + text) */
        .ai-feature {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 11px 12px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            color: var(--hud-white);
            transition: all 0.25s ease;
            position: relative;
        }

        .ai-feature:hover {
            background: rgba(0, 229, 255, 0.08);
            border-color: rgba(0, 229, 255, 0.25);
        }

        .ai-feature.active {
            background: rgba(0, 229, 255, 0.14);
            border-color: rgba(0, 229, 255, 0.55);
            box-shadow:
                inset 0 0 20px rgba(0, 229, 255, 0.08),
                0 0 18px rgba(0, 229, 255, 0.15);
        }

        .ai-feature-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(0, 153, 255, 0.22), rgba(0, 68, 170, 0.22));
            border: 1px solid rgba(0, 229, 255, 0.35);
            color: var(--hud-cyan);
            font-size: 0.95rem;
            flex-shrink: 0;
            transition: all 0.25s ease;
            box-shadow: inset 0 0 8px rgba(0, 229, 255, 0.08);
        }

        .ai-feature:hover .ai-feature-icon {
            border-color: rgba(0, 229, 255, 0.8);
            color: #FFFFFF;
            box-shadow:
                0 0 16px rgba(0, 229, 255, 0.5),
                inset 0 0 10px rgba(0, 229, 255, 0.15);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.9);
        }

        .ai-feature.active .ai-feature-icon {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.35), rgba(0, 153, 255, 0.35));
            border-color: rgba(0, 229, 255, 0.95);
            color: #FFFFFF;
            box-shadow:
                0 0 22px rgba(0, 229, 255, 0.7),
                inset 0 0 12px rgba(0, 229, 255, 0.2);
        }

        .ai-feature-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .ai-feature-name {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: var(--hud-white);
            transition: color 0.25s ease;
        }

        .ai-feature-desc {
            font-size: 0.66rem;
            letter-spacing: 0.4px;
            color: var(--gray);
            opacity: 0.85;
        }

        .ai-feature:hover .ai-feature-name,
        .ai-feature.active .ai-feature-name {
            color: var(--hud-cyan);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
        }

        /* Sidebar Footer */
        .ai-sidebar-footer {
            padding: 12px 18px 16px;
            border-top: 1px solid rgba(0, 229, 255, 0.12);
            font-size: 0.58rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gray);
            opacity: 0.7;
            text-align: center;
            flex-shrink: 0;
        }

        /* ============================================
           MESSAGES AREA
           ============================================ */
        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 26px 28px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 229, 255, 0.3) transparent;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 229, 255, 0.3);
            border-radius: 3px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 229, 255, 0.5);
        }

        .msg {
            max-width: 80%;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            animation: msg-in 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg.ai {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.62rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .msg.ai .msg-avatar {
            background: radial-gradient(circle at 38% 34%,
                #FFFFFF 0%,
                #D8F4FF 15%,
                #7DD3FC 38%,
                #38BDF8 60%,
                #0284C7 85%,
                #0C1A3A 100%);
            color: #FFFFFF;
            box-shadow:
                0 0 12px rgba(56, 189, 248, 0.65),
                0 0 24px rgba(2, 132, 199, 0.3),
                inset 0 0 8px rgba(255, 255, 255, 0.35);
            text-shadow:
                0 0 6px rgba(255, 255, 255, 0.95),
                0 0 10px rgba(56, 189, 248, 0.8);
        }

        .msg.user .msg-avatar {
            background: linear-gradient(135deg, rgba(0, 153, 255, 0.35), rgba(0, 68, 170, 0.35));
            color: var(--hud-white);
            border: 1px solid rgba(0, 229, 255, 0.55);
            box-shadow: 0 0 12px rgba(0, 153, 255, 0.35);
        }

        .msg-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .msg.user .msg-content {
            align-items: flex-end;
        }

        .msg-meta {
            font-size: 0.58rem;
            color: var(--gray);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.75;
            padding: 0 4px;
        }

        .msg.ai .msg-meta {
            color: var(--hud-cyan);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
            opacity: 0.85;
        }

        .msg-bubble {
            padding: 11px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.55;
            letter-spacing: 0.3px;
            word-wrap: break-word;
            position: relative;
        }

        .msg.user .msg-bubble {
            max-width: 100%;
            background: linear-gradient(135deg, rgba(0, 153, 255, 0.32), rgba(0, 68, 170, 0.32));
            border: 1px solid rgba(0, 229, 255, 0.55);
            color: var(--hud-white);
            box-shadow:
                0 4px 20px rgba(0, 153, 255, 0.22),
                inset 0 0 12px rgba(0, 229, 255, 0.08);
            border-top-right-radius: 4px;
        }

        .msg.ai .msg-bubble {
            max-width: 100%;
            background: rgba(0, 12, 24, 0.78);
            border: 1px solid rgba(0, 229, 255, 0.28);
            color: var(--hud-white);
            box-shadow:
                0 4px 20px rgba(0, 229, 255, 0.1),
                inset 0 0 12px rgba(0, 229, 255, 0.04);
            border-top-left-radius: 4px;
        }
        .msg-bubble img {
            max-width: 260px;
            max-height: 40vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 4px;
            display: block;
            border: 1px solid rgba(0, 229, 255, 0.3);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* ============================================
           VIDEO PLACEHOLDER (while generating)
           ============================================ */
        .video-placeholder {
            width: 280px;
            height: 157px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            background:
                linear-gradient(135deg, rgba(0, 229, 255, 0.06), rgba(0, 68, 170, 0.12));
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2), inset 0 0 30px rgba(0, 229, 255, 0.05);
        }

        .video-placeholder::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.18), transparent);
            animation: video-shimmer 2s infinite;
            pointer-events: none;
        }

        @keyframes video-shimmer {
            0%   { left: -100%; }
            100% { left: 100%; }
        }

        .video-loader-ring {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 1.5px solid transparent;
            border-top-color: rgba(0, 229, 255, 0.8);
            border-right-color: rgba(0, 229, 255, 0.25);
            border-radius: 50%;
            animation: rotate-ring 1.5s linear infinite;
            opacity: 0.55;
            pointer-events: none;
        }

        .video-progress-percent {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--hud-cyan);
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.9), 0 0 30px rgba(0, 229, 255, 0.5);
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            position: relative;
            z-index: 2;
            line-height: 1;
        }

        .video-progress-label {
            font-size: 0.58rem;
            color: var(--gray);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            position: relative;
            z-index: 2;
            opacity: 0.9;
        }

        .video-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(0, 229, 255, 0.1);
            z-index: 2;
        }

        .video-progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--hud-blue), var(--hud-cyan));
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.9);
            width: 0%;
            transition: width 0.5s ease;
        }

        .video-status-badge {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.52rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--hud-cyan);
            padding: 3px 10px;
            background: rgba(0, 20, 40, 0.7);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 20px;
            z-index: 2;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.7);
        }

        .video-placeholder.failed {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.12), rgba(180, 30, 30, 0.18));
            border-color: rgba(255, 107, 53, 0.6);
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.3), inset 0 0 30px rgba(255, 107, 53, 0.08);
        }
        .video-placeholder.failed::before {
            animation: none;
            background: none;
        }
        .video-placeholder.failed .video-progress-percent {
            color: #FF8A4C;
            text-shadow: 0 0 15px rgba(255, 107, 53, 0.9);
        }
        .video-placeholder.failed .video-status-badge {
            color: #FF8A4C;
            border-color: rgba(255, 107, 53, 0.6);
            text-shadow: 0 0 8px rgba(255, 107, 53, 0.8);
        }
        .video-placeholder.failed .video-loader-ring {
            animation: none;
            border-color: rgba(255, 107, 53, 0.5);
            border-top-color: #FF8A4C;
        }

        .video-placeholder.network-error {
            background: linear-gradient(135deg, rgba(150, 150, 150, 0.08), rgba(80, 80, 80, 0.15));
            border-color: rgba(150, 150, 150, 0.5);
        }
        .video-placeholder.network-error::before { animation: none; background: none; }
        .video-placeholder.network-error .video-progress-percent {
            color: #AAB4C7;
            font-size: 1.1rem;
            text-shadow: none;
        }
        .video-placeholder.network-error .video-status-badge {
            color: #AAB4C7;
            border-color: rgba(150, 150, 150, 0.5);
        }
        .video-placeholder.network-error .video-loader-ring { display: none; }

        .video-placeholder-wrap {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .msg-bubble img:hover {
            transform: scale(1.02);
            box-shadow: 0 0 22px rgba(0, 229, 255, 0.45);
        }

        /* ============================================
           INPUT BAR
           ============================================ */
        .chat-input-bar {
            padding: 16px 24px calc(18px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid rgba(0, 229, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            background: rgba(0, 8, 20, 0.55);
            position: relative;
        }

        .chat-input-bar::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 18%;
            right: 18%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--hud-cyan), transparent);
            opacity: 0.55;
        }

        .chat-input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            background: rgba(0, 12, 24, 0.85);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 26px;
            padding: 13px 22px;
            color: var(--hud-white);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
        }

        .chat-input::placeholder {
            color: rgba(110, 141, 175, 0.7);
            letter-spacing: 0.5px;
        }

        .chat-input:focus {
            border-color: rgba(0, 229, 255, 0.8);
            box-shadow:
                0 0 22px rgba(0, 229, 255, 0.25),
                inset 0 0 14px rgba(0, 229, 255, 0.1);
            background: rgba(0, 16, 32, 0.9);
        }

        .chat-send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--hud-blue), var(--hud-blue-deep));
            border: 1px solid rgba(0, 229, 255, 0.6);
            color: #E8F6FF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
            transition: all 0.3s ease;
            box-shadow:
                0 6px 18px rgba(0, 153, 255, 0.4),
                0 0 0 1px rgba(0, 229, 255, 0.1),
                inset 0 0 12px rgba(0, 229, 255, 0.15);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
            position: relative;
            overflow: hidden;
        }

        .chat-send-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
            transform: translateX(-150%) skewX(-25deg);
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .chat-send-btn:hover:not(:disabled)::before {
            transform: translateX(150%) skewX(-25deg);
        }

        .chat-send-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.05);
            box-shadow:
                0 10px 26px rgba(0, 229, 255, 0.55),
                0 0 0 1px rgba(0, 229, 255, 0.4),
                inset 0 0 20px rgba(0, 229, 255, 0.3);
            border-color: rgba(0, 229, 255, 1);
        }

        .chat-send-btn:active:not(:disabled) {
            transform: translateY(-1px) scale(1.02);
        }

        .chat-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ============================================
           TYPING INDICATOR
           ============================================ */
        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 4px 2px;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--hud-cyan);
            box-shadow: 0 0 8px var(--hud-cyan);
            animation: typing 1.2s infinite ease-in-out;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ============================================
           RESPONSIVE — TABLET
           ============================================ */
        @media (max-width: 768px) {
            body { padding: 0; }

            .chat-shell {
                height: 100vh;
                max-height: 100vh;
                height: 100dvh;
                max-height: 100dvh;
                max-width: 100%;
                border-radius: 0;
                border-left: none;
                border-right: none;
                border-top: none;
                border-bottom: none;
            }

            .chat-header { padding: 14px 16px; }
            .chat-header-avatar { width: 36px; height: 36px; }
            .chat-header-avatar-text { font-size: 0.7rem; }
            .chat-header-title { font-size: 0.72rem; letter-spacing: 2px; }
            .chat-header-sub { font-size: 0.55rem; letter-spacing: 1.5px; }
            .chat-close-btn { width: 32px; height: 32px; font-size: 0.72rem; }
            .chat-menu-btn { width: 32px; height: 32px; font-size: 0.75rem; }
            .chat-header-left { gap: 10px; }

            .chat-messages { padding: 18px 16px; gap: 14px; }
            .msg { max-width: 88%; gap: 8px; }
            .msg-avatar { width: 26px; height: 26px; font-size: 0.55rem; }
            .msg-bubble { font-size: 0.85rem; padding: 10px 13px; }
            .msg-meta { font-size: 0.52rem; letter-spacing: 1.5px; }

            .chat-input-bar { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
            .chat-input { padding: 11px 18px; font-size: 0.85rem; }
            .chat-send-btn { width: 42px; height: 42px; font-size: 0.85rem; }

            .ai-sidebar { width: 300px; max-width: 82vw; }
            .ai-sidebar-header { padding: 16px 16px 14px; }
            .ai-sidebar-nav { padding: 10px 8px; }
            .ai-feature { padding: 10px 10px; gap: 12px; }
            .ai-feature-icon { width: 36px; height: 36px; font-size: 0.9rem; }
            .ai-feature-name { font-size: 0.78rem; }
            .ai-feature-desc { font-size: 0.62rem; }
        }

        /* ============================================
           RESPONSIVE — SMALL PHONES
           ============================================ */
        @media (max-width: 420px) {
            .chat-header { padding: 12px 14px; }
            .chat-header-avatar { width: 32px; height: 32px; }
            .chat-header-avatar-text { font-size: 0.62rem; }
            .chat-header-title { font-size: 0.66rem; letter-spacing: 1.6px; }
            .chat-header-sub { font-size: 0.5rem; letter-spacing: 1.2px; }
            .chat-header-sub .hud-dot { width: 5px; height: 5px; }
            .chat-close-btn,
            .chat-menu-btn { width: 30px; height: 30px; font-size: 0.68rem; }
            .chat-header-left { gap: 8px; }

            .chat-messages { padding: 14px 12px; gap: 12px; }
            .msg { max-width: 92%; }
            .msg-bubble { font-size: 0.82rem; padding: 9px 12px; }
            .msg-avatar { width: 24px; height: 24px; font-size: 0.5rem; }

            .chat-input-bar { padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
            .chat-input { padding: 10px 16px; font-size: 0.82rem; }
            .chat-send-btn { width: 40px; height: 40px; font-size: 0.8rem; }

            .video-placeholder { width: 240px; height: 135px; }

            .ai-sidebar { width: 280px; max-width: 88vw; }
            .ai-sidebar-header { padding: 14px 14px 12px; }
            .ai-sidebar-title { font-size: 0.66rem; letter-spacing: 1.8px; }
            .ai-sidebar-nav { padding: 8px 6px; }
            .ai-feature { padding: 9px 9px; gap: 11px; }
            .ai-feature-icon { width: 34px; height: 34px; font-size: 0.85rem; }
            .ai-feature-name { font-size: 0.74rem; }
            .ai-feature-desc { font-size: 0.58rem; }
        }
    </style>
</head>
<body>
    <!-- AI SIDEBAR (left drawer, ChatGPT-style) -->
    <div class="ai-sidebar-overlay" id="aiSidebarOverlay"></div>
    <aside class="ai-sidebar" id="aiSidebar" aria-hidden="true">
        <div class="ai-sidebar-header">
            <div class="ai-sidebar-title">
                <i class="fas fa-bolt"></i>
                <span>AI Features</span>
            </div>
            <button class="ai-sidebar-close" id="aiSidebarClose" title="Close">
                <i class="fas fa-xmark"></i>
            </button>
        </div>

        <nav class="ai-sidebar-nav">
            <button class="ai-feature" data-feature="aether">
                <span class="ai-feature-icon"><i class="fas fa-wand-magic-sparkles"></i></span>
                <span class="ai-feature-info">
                    <span class="ai-feature-name">Aether</span>
                    <span class="ai-feature-desc">Image Generation</span>
                </span>
            </button>

            <button class="ai-feature" data-feature="vox">
                <span class="ai-feature-icon"><i class="fas fa-microphone-lines"></i></span>
                <span class="ai-feature-info">
                    <span class="ai-feature-name">Vox</span>
                    <span class="ai-feature-desc">Voice Assistant</span>
                </span>
            </button>

            <button class="ai-feature" data-feature="quill">
                <span class="ai-feature-icon"><i class="fas fa-feather-pointed"></i></span>
                <span class="ai-feature-info">
                    <span class="ai-feature-name">Quill</span>
                    <span class="ai-feature-desc">Writing Assistant</span>
                </span>
            </button>

            <button class="ai-feature" data-feature="lens">
                <span class="ai-feature-icon"><i class="fas fa-eye"></i></span>
                <span class="ai-feature-info">
                    <span class="ai-feature-name">Lens</span>
                    <span class="ai-feature-desc">Vision & Analysis</span>
                </span>
            </button>

            <button class="ai-feature" data-feature="prism">
                <span class="ai-feature-icon"><i class="fas fa-code"></i></span>
                <span class="ai-feature-info">
                    <span class="ai-feature-name">Prism</span>
                    <span class="ai-feature-desc">Code Assistant</span>
                </span>
            </button>
        </nav>

        <div class="ai-sidebar-footer">Nexa · AI Suite</div>
    </aside>

    <div class="chat-shell">
        <div class="chat-header">
            <div class="chat-header-left">
                <button class="chat-menu-btn" id="chatMenuBtn" title="AI Features" aria-label="Toggle AI Features">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="chat-header-avatar">
                    <span class="chat-header-avatar-text">AI</span>
                </div>
                <div class="chat-header-info">
                    <div class="chat-header-title">Nexa AI</div>
                    <div class="chat-header-sub">
                        <span class="hud-dot"></span>
                        <span>Online · Chat Mode</span>
                    </div>
                </div>
            </div>
            <button class="chat-close-btn" id="chatCloseBtn" title="Close Chat">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-bar">
            <div class="chat-input-wrapper">
                <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." autocomplete="off" />
            </div>
            <button class="chat-send-btn" id="chatSendBtn" title="Send">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const chatCloseBtn = document.getElementById('chatCloseBtn');

        // Sidebar elements
        const chatMenuBtn = document.getElementById('chatMenuBtn');
        const aiSidebar = document.getElementById('aiSidebar');
        const aiSidebarOverlay = document.getElementById('aiSidebarOverlay');
        const aiSidebarClose = document.getElementById('aiSidebarClose');
        const aiFeatureBtns = document.querySelectorAll('.ai-feature');

        let isSending = false;

        // Add a message to the chat
        function addMessage(text, sender = 'ai', imageSrc = null) {
            const msg = document.createElement('div');
            msg.className = 'msg ' + sender;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = sender === 'user' ? 'YOU' : 'AI';
            msg.appendChild(avatar);

            const content = document.createElement('div');
            content.className = 'msg-content';

            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            meta.textContent = sender === 'user' ? 'You' : 'Nexa';
            content.appendChild(meta);

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            if (imageSrc) {
                const img = document.createElement('img');
                img.src = imageSrc;

                img.onload = () => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                };
                bubble.appendChild(img);
                if (text) {
                    const p = document.createElement('div');
                    p.textContent = text;
                    bubble.appendChild(p);
                }
            } else {
                bubble.textContent = text;
            }
            content.appendChild(bubble);
            msg.appendChild(content);

            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msg;
        }

        // ============================================
        // VIDEO PLACEHOLDER — create / update / complete
        // ============================================
        let videoPlaceholderId = 0;

        function addVideoPlaceholder(prompt) {
            videoPlaceholderId++;
            const placeholderId = "video-placeholder-" + videoPlaceholderId;

            const msg = document.createElement('div');
            msg.className = 'msg ai';

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = 'AI';
            msg.appendChild(avatar);

            const content = document.createElement('div');
            content.className = 'msg-content';

            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            meta.textContent = 'Nexa · Video';
            content.appendChild(meta);

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            const wrap = document.createElement('div');
            wrap.className = 'video-placeholder-wrap';

            const placeholder = document.createElement('div');
            placeholder.className = 'video-placeholder';
            placeholder.id = placeholderId;
            placeholder.innerHTML = `
                <div class="video-loader-ring"></div>
                <div class="video-status-badge">Generating</div>
                <div class="video-progress-percent" data-percent>0%</div>
                <div class="video-progress-label">Video · ${prompt.slice(0, 30)}${prompt.length > 30 ? '…' : ''}</div>
                <div class="video-progress-bar">
                    <div class="video-progress-bar-fill" data-fill></div>
                </div>
            `;

            wrap.appendChild(placeholder);
            bubble.appendChild(wrap);
            content.appendChild(bubble);
            msg.appendChild(content);

            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return placeholderId;
        }

        function updateVideoPlaceholder(placeholderId, percent, statusLabel) {
            const placeholder = document.getElementById(placeholderId);
            if (!placeholder) return;

            const pctEl = placeholder.querySelector('[data-percent]');
            const barEl = placeholder.querySelector('[data-fill]');
            const badge = placeholder.querySelector('.video-status-badge');

            if (pctEl) pctEl.textContent = Math.round(percent) + '%';
            if (barEl) barEl.style.width = Math.min(100, percent) + '%';
            if (badge && statusLabel) badge.textContent = statusLabel;
        }

        function startFakeProgress(placeholderId) {
            let percent = 0;
            const interval = setInterval(() => {
                percent += 5;
                if (percent >= 50) {
                    percent = 50;
                    clearInterval(interval);
                }
                updateVideoPlaceholder(placeholderId, percent, "Generating");
            }, 100);
            return interval;
        }

        function markVideoFailed(placeholderId, errorMsg) {
            const placeholder = document.getElementById(placeholderId);
            if (!placeholder) return;

            placeholder.classList.add('failed');

            const pctEl = placeholder.querySelector('[data-percent]');
            const label = placeholder.querySelector('.video-progress-label');
            const badge = placeholder.querySelector('.video-status-badge');
            const barEl = placeholder.querySelector('[data-fill]');

            if (pctEl) pctEl.textContent = 'FAILED';
            if (badge) badge.textContent = 'Failed';
            if (label) label.textContent = errorMsg || 'Video generation failed';
            if (barEl) {
                barEl.style.width = '100%';
                barEl.style.background = 'linear-gradient(90deg, #E5411F, #FF8A4C)';
                barEl.style.boxShadow = '0 0 12px rgba(255, 107, 53, 0.9)';
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function markVideoNetworkError(placeholderId) {
            const placeholder = document.getElementById(placeholderId);
            if (!placeholder) return;

            placeholder.classList.add('network-error');

            const pctEl = placeholder.querySelector('[data-percent]');
            const label = placeholder.querySelector('.video-progress-label');
            const badge = placeholder.querySelector('.video-status-badge');
            const barEl = placeholder.querySelector('.video-progress-bar');

            if (pctEl) pctEl.textContent = 'Network Error';
            if (badge) badge.textContent = 'Offline';
            if (label) label.textContent = 'Connection lost. Retrying…';
            if (barEl) barEl.style.display = 'none';

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function replaceVideoPlaceholderWithVideo(placeholderId, videoBase64) {
            const placeholder = document.getElementById(placeholderId);
            if (!placeholder) return;

            const video = document.createElement('video');
            video.src = `data:video/mp4;base64,${videoBase64}`;
            video.controls = true;
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.style.maxWidth = "280px";
            video.style.width = "100%";
            video.style.height = "auto";
            video.style.borderRadius = "8px";
            video.style.display = "block";
            video.style.border = "1px solid rgba(0, 229, 255, 0.45)";
            video.style.boxShadow = "0 0 40px rgba(0, 229, 255, 0.35)";

            placeholder.replaceWith(video);

            video.onloadedmetadata = () => {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            };
        }

        // Typing indicator
        function addTyping() {
            const msg = document.createElement('div');
            msg.className = 'msg ai';
            msg.id = 'typingIndicator';

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = 'AI';
            msg.appendChild(avatar);

            const content = document.createElement('div');
            content.className = 'msg-content';

            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            meta.textContent = 'Nexa';
            content.appendChild(meta);

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.innerHTML = '<span></span><span></span><span></span>';
            bubble.appendChild(typing);
            content.appendChild(bubble);

            msg.appendChild(content);
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // Welcome message
        addMessage('Nexa online. How can I assist you?', 'ai');

        // Send handler
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || isSending) return;

            if (localStorage.getItem('nexa_busy_mode') === 'voice') {
                addMessage('Voice mode is active. Please stop voice input to use chat.', 'ai');
                return;
            }

            addMessage(text, 'user');
            chatInput.value = '';
            isSending = true;
            chatSendBtn.disabled = true;

            localStorage.setItem('nexa_busy_mode', 'chat');

            addTyping();

            try {
                const [res] = await Promise.all([
                    fetch("https://nexa-ai-pgs3.onrender.com/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text })
                    }),
                    new Promise(resolve => setTimeout(resolve, 500))
                ]);

                removeTyping();

                if (!res.ok) {
                    addMessage('server not responding.', 'ai');
                    return;
                }

                const contentType = res.headers.get("content-type");
                if (!contentType) {
                    addMessage('No response content.', 'ai');
                    return;
                }

                if (contentType.includes("application/json")) {
                    const data = await res.json();

                    if (data.type === "image" && data.image) {
                        addMessage('', 'ai', `data:image/jpeg;base64,${data.image}`);
                        return;
                    }

                    if (data.message) {
                        addMessage(data.message, 'ai');
                        return;
                    }

                    if (data.type === "video" && data.video) {
                        const placeholderId = addVideoPlaceholder(promptText);
                        startFakeProgress(placeholderId);

                        setTimeout(() => {
                            updateVideoPlaceholder(placeholderId, 100, "Complete");
                            replaceVideoPlaceholderWithVideo(placeholderId, data.video);
                        }, 1500);
                        return;
                    }
                }

                addMessage('Response received but no handler matched.', 'ai');

            } catch (err) {
                removeTyping();
                console.error("Chat error:", err);
                addMessage('Backend server disconnected');
            } finally {
                isSending = false;
                chatSendBtn.disabled = false;
                chatInput.focus();
                if (localStorage.getItem('nexa_busy_mode') === 'chat') {
                    localStorage.removeItem('nexa_busy_mode');
                }
            }
        }

        chatSendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        chatCloseBtn.addEventListener('click', () => {
            if (localStorage.getItem('nexa_busy_mode') === 'chat') {
                localStorage.removeItem('nexa_busy_mode');
            }
            window.close();
        });

        window.addEventListener('beforeunload', () => {
            if (localStorage.getItem('nexa_busy_mode') === 'chat') {
                localStorage.removeItem('nexa_busy_mode');
            }
        });

        // ============================================
        // SIDEBAR — ChatGPT-style open/close
        // ============================================
        function openSidebar() {
            aiSidebar.classList.add('open');
            aiSidebarOverlay.classList.add('open');
            aiSidebar.setAttribute('aria-hidden', 'false');
            chatMenuBtn.classList.add('active');
        }

        function closeSidebar() {
            aiSidebar.classList.remove('open');
            aiSidebarOverlay.classList.remove('open');
            aiSidebar.setAttribute('aria-hidden', 'true');
            chatMenuBtn.classList.remove('active');
        }

        chatMenuBtn.addEventListener('click', () => {
            if (aiSidebar.classList.contains('open')) {
                closeSidebar();
            } else {
                openSidebar();
            }
        });

        aiSidebarClose.addEventListener('click', closeSidebar);
        aiSidebarOverlay.addEventListener('click', closeSidebar);

        // ESC key closes sidebar
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && aiSidebar.classList.contains('open')) {
                closeSidebar();
            }
        });

        // AI feature buttons — visual select (logic later)
        aiFeatureBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const isActive = btn.classList.contains('active');
                aiFeatureBtns.forEach(b => b.classList.remove('active'));
                if (!isActive) {
                    btn.classList.add('active');
                }
                // Placeholder — actual feature action will be wired later
                console.log('AI feature selected:', btn.dataset.feature);
            });
        });

        chatInput.focus();
    </script>
